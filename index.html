<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic: The Gathering – Card Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sometype+Mono&display=swap" rel="stylesheet">
<link href="Styles.css" rel="stylesheet">
</head>
<body>
<div class="page">
  <section class="top">
    <img class="logo" src="assets/logo.png" alt="Magic: The Gathering">

    <form class="controls" id="form">
      <label class="field search">
        <input type="search" id="q" placeholder="Search for Card... eg “Sol ring”" aria-label="Search for card">
        <button type="submit" aria-label="Search">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="9" r="6.5"/><path d="M14 14l6 6"/></svg>
        </button>
      </label>

      <div class="selects">
        <select id="set" aria-label="Sets"><option value="">All Sets</option></select>
        <select id="type" aria-label="Type"><option value="">All Types</option><option>Creature</option><option>Instant</option><option>Sorcery</option><option>Artifact</option><option>Enchantment</option><option>Land</option><option>Planeswalker</option></select>
        <select id="rarity" aria-label="Rarity"><option value="">All Rarities</option><option>common</option><option>uncommon</option><option>rare</option><option>mythic</option></select>
      </div>

      <div class="colours" role="group" aria-label="Colour">
        <span>Colour</span>
        <button type="button" data-c="w" aria-pressed="false" aria-label="White"><img src="assets/mana-w.png" alt=""></button>
        <button type="button" data-c="u" aria-pressed="false" aria-label="Blue"><img src="assets/mana-u.png" alt=""></button>
        <button type="button" data-c="b" aria-pressed="false" aria-label="Black"><img src="assets/mana-b.png" alt=""></button>
        <button type="button" data-c="r" aria-pressed="false" aria-label="Red"><img src="assets/mana-r.png" alt=""></button>
        <button type="button" data-c="g" aria-pressed="false" aria-label="Green"><img src="assets/mana-g.png" alt=""></button>
        <button type="button" data-c="c" aria-pressed="false" aria-label="Colourless"><img src="assets/mana-c.png" alt=""></button>
      </div>
    </form>
  </section>

  <section class="results">
    <hr>
    <p class="summary" id="summary">“Search Result”<span>Set Result</span><i></i><span>Type Result</span><i></i><span>Rarity Result</span><i></i><span>Colour Result</span><i></i></p>
    <hr>
  </section>

  <p class="status" id="status" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" type="button" hidden>Load more</button>
</div>
<dialog id="dlg">
  <img id="big" alt="">
  <button type="button" class="close" id="close">Close</button>
</dialog>
<script src="script.js"></script>
</body>
</html>
